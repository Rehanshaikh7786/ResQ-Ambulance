<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<title>{% block title %}GoldenHour SOS{% endblock %} · Emergency response</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
{% block head %}{% endblock %}
</head>
<body data-i18n="{{ i18n or 'on' }}">
<nav class="nav">
  <a class="logo" href="/"><i>✚</i><span>GoldenHour SOS<small>EMERGENCY RESPONSE</small></span></a>
  <a class="l {{ 'on' if nav=='report' }}" href="/report">Report</a>
  <a class="l {{ 'on' if nav=='control' }}" href="/control">Control Room</a>
  <a class="l {{ 'on' if nav=='hospital' }}" href="/hospital">Hospital Desk</a>
  <a class="l {{ 'on' if nav=='driver' }}" href="/driver">Driver</a>
  {% if i18n != 'off' %}<select id="lang" aria-label="Language" style="width:auto;padding:6px 8px;font-size:13px"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select>{% endif %}
  <a class="call" href="tel:112">📞 112</a>
</nav>
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='vendor/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/maps.js') }}"></script>
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
{% block scripts %}{% endblock %}
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
</body>
</html>
